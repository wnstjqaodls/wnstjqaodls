name: velog 피드 갱신

on:
  schedule:
    # 6시간마다. UTC 기준이라 KST로는 09/15/21/03시.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/velog-feed.mjs'
      - '.github/workflows/velog-feed.yml'

permissions:
  contents: write

concurrency:
  group: velog-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 피드 수집 및 README 갱신
        run: node scripts/velog-feed.mjs

      - name: 변경분 커밋
        run: |
          if git diff --quiet -- README.md; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: velog 피드 갱신"
          git push
